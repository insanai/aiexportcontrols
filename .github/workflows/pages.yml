# Builds and deploys https://insanai.github.io/aiexportcontrols/ natively with
# Guidedog v1.0.0-beta.10 (https://github.com/insanai/guidedog/releases/tag/v1.0.0-beta.10):
#   - Multilingual landing pages (site/)
#   - 11-chapter web book in 7 languages (book/)
#   - 7 typeset A4 PDF books with illustrations and native diagrams (books/)
#   - Verified primary source archives (sources/)
name: Build and publish the book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CJK/Devanagari fonts and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core poppler-utils jq

      - name: Install Guidedog 1.0.0-beta.10
        env:
          GUIDEDOG_VERSION: 1.0.0-beta.10
          GUIDEDOG_SHA256: 122b24d59aff93e2bda6d2f4af130680259675b5220f9ff104033dac5b82afa7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/guidedog-linux-amd64.tar.gz"
          url="https://github.com/insanai/guidedog/releases/download/v${GUIDEDOG_VERSION}/guidedog-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location "$url" -o "$archive"
          printf '%s  %s\n' "$GUIDEDOG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/guidedog"
          tar -xzf "$archive" -C "$RUNNER_TEMP/guidedog" --strip-components=1
          echo "$RUNNER_TEMP/guidedog" >> "$GITHUB_PATH"

      - name: Verify translations and build the complete site + PDF books
        run: |
          set -euo pipefail
          guidedog --version
          guidedog intl stat -l zh_CN -l ja -l ko -l hi -l es -l de site
          guidedog intl stat -l zh_CN -l ja -l ko -l hi -l es -l de book
          guidedog ssg build . --out public
          touch public/.nojekyll

      - name: Verify primary-source SHA-256 hashes and all 7 PDF editions
        run: |
          set -euo pipefail
          # 1. Verify every downloaded primary-source snapshot matches sources.json
          jq -r '.[] | select(.sha256 != null) | "\(.sha256)  \(.snapshot)"' research/sources.json | sha256sum --check --strict
          cmp -s research/snapshots/announcement-48-attachment-1.wps public/sources/announcement-48-attachment-1.wps
          cmp -s research/snapshots/announcement-48-attachment-2.wps public/sources/announcement-48-attachment-2.wps

          # 2. Verify all 7 HTML editions and all 7 typeset A4 PDF books
          for pair in "en:en" "zh_CN:zh-cn" "ja:ja" "ko:ko" "hi:hi" "es:es" "de:de"; do
            code="${pair%%:*}"
            dir="${pair##*:}"
            test -s "public/${dir}/index.html"
            test -s "public/${dir}/atlas.html"
            test -s "public/${dir}/comparison.html"
            pdf="public/books/${dir}/open-source-ai-export-controls-${code}.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "$pages" -ge 25
            txt="$RUNNER_TEMP/pdf-${code}.txt"
            pdftotext "$pdf" "$txt"
            grep -q "266504X" "$txt"
            grep -q "266506X" "$txt"
            grep -q "266507X" "$txt"
            grep -q "3A090" "$txt"
            grep -q "4E091" "$txt"
          done
          test -s public/index.html
          test -s public/404.html
          test -s public/sitemap.xml

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
